{% extends "base.html" %}

{% block content %}

<div class="main-content">

<div class="focus-container">

    <h1>Focus Timer</h1>
    <div class="timer-settings">

        <input
            type="number"
            id="custom-minutes"
            min="1"
            value="25"
            placeholder="Minutes">

        <button id="set-timer-btn">
            Set Timer
        </button>

</div>
    <div class="timer-display">

        <span id="minutes">25</span>
        :
        <span id="seconds">00</span>

    </div>

    <div class="timer-buttons">

        <button id="start-btn">
            Start
        </button>

        <button id="pause-btn">
            Pause
        </button>

        <button id="reset-btn">
            Reset
        </button>

    </div>

</div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='focus.js') }}"></script>
{% endblock %}
